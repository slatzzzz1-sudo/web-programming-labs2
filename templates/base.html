<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самойлов Дмитрий. {% block lab %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='lab2.css') }}">
    <style>
        body {
            {% if request.cookies.get('color') %}
            color: {{ request.cookies.get('color') }};
            {% endif %}
            {% if request.cookies.get('bgcolor') %}
            background-color: {{ request.cookies.get('bgcolor') }};
            {% endif %}
            {% if request.cookies.get('fontsize') %}
            font-size: {{ request.cookies.get('fontsize') }};
            {% endif %}
            {% if request.cookies.get('lineheight') %}
            line-height: {{ request.cookies.get('lineheight') }};
            {% endif %}
        }
        /* Общие стили для лабораторной работы 5 - темная современная версия */
        .lab5-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px;
            font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.8;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
            animation: fadeInUp 0.8s ease-out;
        }

        .lab5-container h1 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            text-shadow: 0 10px 20px rgba(96, 165, 250, 0.2);
            letter-spacing: -0.5px;
            position: relative;
            overflow: hidden;
        }

        .lab5-container h1:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 2px;
        }

        .lab5-container h2 {
            margin-top: 40px;
            margin-bottom: 25px;
            font-size: 2.2em;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 20px 0;
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, #3b82f6, #8b5cf6) 1;
            font-family: 'Inter', sans-serif;
        }

        /* Стили для форм */
        .lab5-form {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            border: 1px solid rgba(100, 116, 139, 0.3);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lab5-form:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .lab5-form:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.15), transparent);
            transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lab5-form:hover:before {
            left: 100%;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            color: #94a3b8;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
        }

        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid rgba(100, 116, 139, 0.5);
            border-radius: 12px;
            font-size: 17px;
            transition: all 0.4s ease;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.7);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(5px);
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
            background: rgba(15, 23, 42, 0.9);
        }

        .form-group textarea {
            min-height: 280px;
            resize: vertical;
            line-height: 1.8;
        }

        /* Стили для кнопок */
        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            padding: 18px 45px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            gap: 10px;
        }

        .btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.4);
        }

        .btn:hover:before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        /* Стили для статей */
        .article-list {
            margin-top: 50px;
            display: grid;
            gap: 25px;
        }

        .article-item {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .article-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .article-item:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        }

        .article-title {
            margin-bottom: 25px;
            font-size: 1.9em;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
            font-family: 'Inter', sans-serif;
        }

        .article-text {
            color: #cbd5e1;
            line-height: 1.9;
            font-size: 17px;
            background: rgba(15, 23, 42, 0.5);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(100, 116, 139, 0.2);
            backdrop-filter: blur(5px);
            font-family: 'Inter', sans-serif;
        }

        /* Стили для сообщений об ошибках */
        .error-message {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.9) 0%, rgba(185, 28, 28, 0.95) 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin: 25px 0;
            text-align: center;
            font-weight: 600;
            font-size: 17px;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3);
            border: 1px solid rgba(220, 38, 38, 0.3);
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .success-message {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.9) 0%, rgba(21, 128, 61, 0.95) 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin: 25px 0;
            text-align: center;
            font-weight: 600;
            font-size: 17px;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
            border: 1px solid rgba(34, 197, 94, 0.3);
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        /* Стили для ссылок */
        .lab5-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 17px;
            position: relative;
            padding: 5px 0;
            font-family: 'Inter', sans-serif;
        }

        .lab5-link:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s ease;
        }

        .lab5-link:hover {
            color: #a78bfa;
            text-decoration: none;
        }

        .lab5-link:hover:after {
            width: 100%;
        }

        /* Стили для блоков с уведомлениями */
        .notification-block {
            text-align: center;
            padding: 60px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
            color: #60a5fa;
            border-radius: 20px;
            margin: 40px 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .notification-block:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            animation: shine 4s infinite;
            animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .notification-block h1 {
            color: transparent;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            z-index: 1;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .lab5-container {
                padding: 25px;
                max-width: 100%;
            }
            
            .lab5-container h1 {
                font-size: 2.5em;
                padding: 30px 20px;
            }
            
            .lab5-form {
                padding: 30px 25px;
            }
            
            .article-item {
                padding: 25px;
            }
            
            .btn {
                padding: 16px 35px;
                font-size: 16px;
                width: 100%;
                justify-content: center;
            }
            
            .form-group input[type="text"],
            .form-group input[type="password"],
            .form-group textarea,
            .form-group select {
                padding: 16px;
                font-size: 16px;
            }
            
            .notification-block {
                padding: 40px 25px;
            }
        }

        /* Дополнительные улучшения */
        .form-group input[type="text"]::placeholder,
        .form-group input[type="password"]::placeholder,
        .form-group textarea::placeholder,
        .form-group select::placeholder {
            color: #64748b;
            font-style: italic;
        }

        .article-text::first-letter {
            font-size: 2.2em;
            font-weight: 800;
            color: #60a5fa;
            float: left;
            margin-right: 10px;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(96, 165, 250, 0.3);
        }

        /* Анимация для плавного появления */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lab5-form,
        .article-item,
        .notification-block {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .lab5-form { animation-delay: 0.1s; }
        .article-item:nth-child(1) { animation-delay: 0.2s; }
        .article-item:nth-child(2) { animation-delay: 0.3s; }
        .article-item:nth-child(3) { animation-delay: 0.4s; }
        .notification-block { animation-delay: 0.5s; }

        /* Иконки в кнопках */
        .btn:after {
            content: attr(data-icon);
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .btn:hover:after {
            transform: translateX(5px);
        }

        /* Подсказки в формах */
        .form-group input[type="text"]:valid,
        .form-group input[type="password"]:valid,
        .form-group textarea:valid {
            border-color: rgba(34, 197, 94, 0.5);
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
        }

        /* Эффект стекла для контейнеров */
        .lab5-form,
        .article-item,
        .notification-block {
            background: linear-gradient(
                135deg,
                rgba(30, 41, 59, 0.7) 0%,
                rgba(15, 23, 42, 0.8) 100%
            );
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Эффект параллакса для заголовков */
        .lab5-container h1 {
            perspective: 1000px;
        }

        .lab5-container h1 span {
            display: inline-block;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .lab5-container h1:hover span {
            transform: translateZ(20px);
        }

        .users-list {
            margin-top: 40px;
        }

        .user-item {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            padding: 25px 30px;
            margin-bottom: 20px;
            border-radius: 16px;
            border-left: 6px solid #3b82f6;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: all 0.4s ease;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .user-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.2);
        }

        .form-group label input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.5);
            cursor: pointer;
        }
            
    </style>
</head>
<body>
    <header>
        WEB-программирование, 2 часть. {{ self.lab() }}
    </header>

    <main>
        {% block main %}{% endblock %}
    </main>

    <footer>
        &copy; Самойлов Дмитрий, ФБИ-32, 3 курс, 2025
    </footer>
</body>
</html>
