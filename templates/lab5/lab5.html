{% extends "base.html" %}

{% block lab %}Лабораторная работа 5{% endblock %}

{% block main %}
<style>
.knowledge-base {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px;
    font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    color: #e2e8f0;
}

.header {
    text-align: center;
    margin-bottom: 60px;
    padding-bottom: 30px;
    border-bottom: 3px solid;
    border-image: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent) 1;
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(59, 130, 246, 0.2);
}

.header h1 {
    font-size: 52px;
    font-weight: 800;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
    text-shadow: 0 5px 15px rgba(96, 165, 250, 0.2);
    letter-spacing: -0.5px;
    font-family: 'Inter', sans-serif;
}

.header p {
    color: #94a3b8;
    font-size: 20px;
    margin-top: 15px;
    font-weight: 400;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
}

.menu-list {
    list-style: none;
    padding: 0;
    margin: 0 0 60px 0;
    display: grid;
    gap: 25px;
}

.menu-list li {
    margin: 0;
    padding: 0;
    transform: translateY(0);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.menu-list li:hover {
    transform: translateY(-8px) scale(1.02);
}

.menu-list a {
    display: flex;
    align-items: center;
    padding: 28px 35px;
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
    border: 1px solid rgba(100, 116, 139, 0.3);
    border-radius: 18px;
    text-decoration: none;
    color: #f1f5f9;
    font-size: 20px;
    font-weight: 600;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
}

.menu-list a:before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
    transition: left 0.7s ease;
}

.menu-list a:hover {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(139, 92, 246, 0.3) 100%);
    color: #ffffff;
    box-shadow: 0 15px 35px rgba(59, 130, 246, 0.3);
    border-color: rgba(59, 130, 246, 0.5);
    transform: translateX(5px);
}

.menu-list a:hover:before {
    left: 100%;
}

.menu-list a:after {
    content: '⟶';
    position: absolute;
    right: 35px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: all 0.4s ease;
    color: #60a5fa;
    font-size: 24px;
    font-weight: 300;
}

.menu-list a:hover:after {
    opacity: 1;
    right: 25px;
    transform: translateY(-50%) scale(1.2);
}

.menu-list a:before {
    content: attr(data-icon);
    margin-right: 20px;
    font-size: 24px;
    transition: transform 0.3s ease;
}

.menu-list a:hover:before {
    transform: scale(1.2);
}

.user-info {
    text-align: center;
    padding: 30px;
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 18px;
    font-size: 20px;
    color: #60a5fa;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(5px);
}

.user-info:before {
    content: '👤 ';
    margin-right: 12px;
    filter: drop-shadow(0 0 5px rgba(96, 165, 250, 0.5));
}

.user-info:after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
}

/* Добавляем анимацию для плавного появления */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.knowledge-base {
    animation: fadeInUp 0.8s ease-out;
}

.menu-list li {
    animation: fadeInUp 0.6s ease-out forwards;
    opacity: 0;
}

.menu-list li:nth-child(1) { animation-delay: 0.1s; }
.menu-list li:nth-child(2) { animation-delay: 0.2s; }
.menu-list li:nth-child(3) { animation-delay: 0.3s; }
.menu-list li:nth-child(4) { animation-delay: 0.4s; }
.menu-list li:nth-child(5) { animation-delay: 0.5s; }

/* Адаптивность */
@media (max-width: 768px) {
    .knowledge-base {
        padding: 20px;
        max-width: 100%;
    }
    
    .header h1 {
        font-size: 36px;
    }
    
    .header p {
        font-size: 18px;
        padding: 0 15px;
    }
    
    .menu-list a {
        padding: 22px 25px;
        font-size: 18px;
    }
    
    .user-info {
        padding: 25px 20px;
        font-size: 18px;
    }
}

/* Эффект свечения для хедера */
.header h1 {
    position: relative;
}

.header h1:after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 2px;
    opacity: 0.7;
}
</style>
<div class="knowledge-base">
    <div class="header">
        <h1>База знаний</h1>
    </div>
    
    <ol class="menu-list">
    <ol>
        <li><a href="/lab5/login">Войти</a></li>
        <li><a href="/lab5/register">Регистрация</a></li>
        <li><a href="/lab5/list">Список статей</a></li>
        <li><a href="/lab5/create">Создать статью</a></li>
    </ol>
    <div class="user-info">
        Anonym
    </div>
{% endblock %}
