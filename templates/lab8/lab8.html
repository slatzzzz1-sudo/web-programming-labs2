{% extends "base.html" %}

{% block lab %}Лабораторная работа 8{% endblock %}

{% block main %}
<style>
    .welcome-box {max-width:800px;margin:60px auto;padding:40px;background:#1a1a2e;border-radius:20px;text-align:center;border:3px solid #8a6dc9;}
    .welcome-title {color:#8a6dc9;font-size:2.5em;margin-bottom:20px;}
    .welcome-text {color:#b8b8d1;font-size:1.3em;margin-bottom:40px;}
    .btn-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:40px;}
    .welcome-btn {background:linear-gradient(135deg,#8a6dc9,#6d4cc3);color:white;padding:18px;border-radius:12px;text-decoration:none;font-size:18px;transition:0.3s;border:2px solid transparent;}
    .welcome-btn:hover {transform:translateY(-5px);border-color:#a991e8;box-shadow:0 10px 25px rgba(138,109,201,0.4);}
    .guest-note {color:#8a7aa3;margin-top:30px;font-size:16px;}
    .guest-note a {color:#a991e8;text-decoration:none;}
    .guest-note a:hover {text-decoration:underline;}
</style>

<div class="welcome-box">
    <h1 class="welcome-title">🔐 База знаний</h1>
    <p class="welcome-text">Добро пожаловать, <strong>Anonymous</strong>!</p>
    
    <div class="btn-grid">
        <a href="/lab8/login" class="welcome-btn">🔑 Вход</a>
        <a href="/lab8/register" class="welcome-btn">📝 Регистрация</a>
        <a href="/lab8/article/public" class="welcome-btn">🌐 Публичные статьи</a>
        <a href="/" class="welcome-btn">🏠 На главную</a>
    </div>
    
    <p class="guest-note">
        Для создания статей требуется <a href="/lab8/register">регистрация</a>
    </p>
</div>
{% endblock %}
