{% extends "base.html" %}
{% block lab %}Лабораторная работа 8{% endblock %}

{% block main %}
<style>
    .edit-box {max-width:800px;margin:40px auto;padding:30px;background:#1a1a2e;border-radius:20px;border:3px solid #2d2d4d;}
    .edit-title {color:#8a6dc9;text-align:center;margin-bottom:30px;}
    .error-msg {background:#ff4444;color:white;padding:15px;border-radius:10px;margin:20px 0;text-align:center;}
    .edit-form {display:flex;flex-direction:column;gap:25px;}
    .form-group {display:flex;flex-direction:column;gap:10px;}
    .form-group label {color:#b8b8d1;font-weight:500;}
    .edit-input {padding:14px;background:#252547;border:2px solid #3a3a6a;border-radius:10px;color:white;font-size:16px;}
    .edit-input:focus {outline:none;border-color:#8a6dc9;box-shadow:0 0 15px rgba(138,109,201,0.3);}
    .edit-textarea {min-height:300px;resize:vertical;}
    .checkbox-group {display:flex;gap:20px;flex-wrap:wrap;}
    .checkbox-item {display:flex;align-items:center;gap:10px;background:#252547;padding:15px;border-radius:10px;}
    .checkbox-item label {cursor:pointer;}
    .checkbox-item input[type="checkbox"] {width:20px;height:20px;accent-color:#8a6dc9;cursor:pointer;}
    .save-btn {background:linear-gradient(135deg,#8a6dc9,#6d4cc3);color:white;border:none;padding:16px;border-radius:12px;font-size:18px;cursor:pointer;transition:0.3s;margin-top:20px;}
    .save-btn:hover {background:linear-gradient(135deg,#6d4cc3,#8a6dc9);transform:translateY(-3px);box-shadow:0 10px 25px rgba(138,109,201,0.4);}
    .char-count {color:#8a7aa3;font-size:14px;text-align:right;margin-top:5px;}
</style>

<div class="edit-box">
    <h1 class="edit-title">✏️ Редактирование статьи</h1>
    
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}
    
    <form class="edit-form" method="POST" action="/lab8/article/edit/{{ article.id }}">
        <div class="form-group">
            <label>Название статьи:</label>
            <input class="edit-input" type="text" id="title" name="title" maxlength="50" 
                   value="{{ article.title }}" required oninput="updateCharCount('title', 50)">
            <div class="char-count" id="title-count">0/50</div>
        </div>
        
        <div class="form-group">
            <label>Текст статьи:</label>
            <textarea class="edit-input edit-textarea" id="text" name="text" required>{{ article.article_text }}</textarea>
        </div>
        
        <div class="checkbox-group">
            <div class="checkbox-item">
                <input type="checkbox" id="is_favorite" name="is_favorite" {% if article.is_favorite %}checked{% endif %}>
                <label for="is_favorite">⭐ В избранном</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="is_public" name="is_public" {% if article.is_public %}checked{% endif %}>
                <label for="is_public">🌐 Публичная статья</label>
            </div>
        </div>
        
        <button class="save-btn" type="submit">💾 Сохранить изменения</button>
    </form>
</div>

<script>
    function updateCharCount(inputId, maxLength) {
        const input = document.getElementById(inputId);
        const count = document.getElementById(inputId + '-count');
        const currentLength = input.value.length;
        count.textContent = `${currentLength}/${maxLength}`;
        count.style.color = currentLength > maxLength * 0.8 ? '#ff6b6b' : '#8a7aa3';
    }
    
    // Инициализация счетчика символов
    document.addEventListener('DOMContentLoaded', function() {
        updateCharCount('title', 50);
    });
</script>
{% endblock %}
