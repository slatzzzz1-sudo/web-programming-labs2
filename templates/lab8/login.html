{% extends "base.html" %}
{% block lab %}Лабораторная работа 8{% endblock %}

{% block main %}
<style>
    .login-box {max-width:400px;margin:40px auto;padding:30px;background:#1a1a2e;border-radius:15px;border:2px solid #2d2d4d;}
    .login-title {text-align:center;color:#8a6dc9;margin-bottom:25px;}
    .login-form {display:flex;flex-direction:column;gap:20px;}
    .input-group label {display:block;color:#b8b8d1;margin-bottom:8px;}
    .login-input {width:100%;padding:12px;background:#252547;border:2px solid #3a3a6a;border-radius:8px;color:white;}
    .login-input:focus {outline:none;border-color:#8a6dc9;box-shadow:0 0 10px rgba(138,109,201,0.3);}
    .checkbox {display:flex;align-items:center;gap:10px;color:#b8b8d1;}
    .error {background:#ff4444;color:white;padding:12px;border-radius:8px;text-align:center;}
    .login-btn {background:#8a6dc9;color:white;border:none;padding:14px;border-radius:8px;font-size:16px;cursor:pointer;transition:0.3s;}
    .login-btn:hover {background:#6d4cc3;transform:translateY(-2px);}
    .register-link {text-align:center;margin-top:20px;color:#8a7aa3;}
    .register-link a {color:#a991e8;text-decoration:none;}
    .register-link a:hover {text-decoration:underline;}
</style>

<div class="login-box">
    <h1 class="login-title">Вход в систему</h1>
    
    <form class="login-form" action="/lab8/login" method="post">
        <div class="input-group">
            <label>Логин:</label>
            <input class="login-input" type="text" name="login" required>
        </div>
        
        <div class="input-group">
            <label>Пароль:</label>
            <input class="login-input" type="password" name="password" required>
        </div>
        
        <div class="checkbox">
            <input type="checkbox" name="remember" id="remember">
            <label for="remember">Запомнить меня</label>
        </div>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <button class="login-btn" type="submit">Вход</button>
    </form>
    
    <div class="register-link">
        Нет аккаунта? <a href="/lab8/register">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
