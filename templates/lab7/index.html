{% extends "base.html" %}

{% block lab %}Лабораторная работа 7{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='lab7/main.js') }}"></script>
<style>
    table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        max-width: 1000px;
        background: #111;
        border-radius: 0;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 255, 136, 0.2);
        margin: 0 auto;
        font-family: 'Courier New', monospace;
        border: 2px solid #00ff88;
    }

    thead {
        background: #000;
        color: #00ff88;
    }

    th {
        padding: 16px 20px;
        text-align: left;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 1px;
        position: relative;
        border-bottom: 2px solid #00ff88;
    }

    th:not(:last-child)::after {
        content: '│';
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        color: #00ff88;
        opacity: 0.5;
    }

    th[colspan="2"] {
        text-align: center;
        font-size: 18px;
        padding: 18px;
    }

    td {
        padding: 14px 20px;
        text-align: left;
        border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        vertical-align: top;
        font-size: 14px;
        color: #fff;
        line-height: 1.5;
    }

    tbody tr:nth-child(even) {
        background: rgba(0, 20, 10, 0.3);
    }

    tbody tr {
        transition: all 0.2s ease;
    }

    tbody tr:hover {
        background: rgba(0, 255, 136, 0.1);
        transform: scale(1.005);
        box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
    }

    button {
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid #00ff88;
        background: #000;
        color: #00ff88;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-right: 8px;
        letter-spacing: 1px;
        box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }

    button:hover {
        transform: translateY(-2px);
        background: #00ff88;
        color: #000;
        box-shadow: 0 0 20px #00ff88;
    }

    div > button {
        margin-top: 24px;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 700;
        background: #000;
        border: 2px solid #ff00ff;
        color: #ff00ff;
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    div > button::before {
        content: '🚀';
        font-size: 16px;
    }

    .modal button:last-of-type {
        background: #000;
        color: #ff3366;
        border: 1px solid #ff3366;
        box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
    }

    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #000;
        width: 460px;
        padding: 24px;
        border-radius: 0;
        box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
        border: 2px solid #00ffff;
    }

    .modal::before {
        content: '💾';
        position: absolute;
        top: -20px;
        left: -20px;
        font-size: 24px;
        background: #000;
        border: 2px solid #00ffff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal label {
        display: block;
        margin-bottom: 12px;
        font-weight: 700;
        color: #00ffff;
        font-size: 14px;
    }

    .modal input[type="text"],
    .modal input[type="number"],
    .modal textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 14px;
        border-radius: 4px;
        border: 1px solid #00ff88;
        font-size: 14px;
        margin-top: 6px;
        transition: all 0.2s ease;
        background: #000;
        color: #fff;
        font-family: 'Courier New', monospace;
    }

    .modal textarea {
        min-height: 90px;
        resize: vertical;
        line-height: 1.4;
    }

    .modal input:focus,
    .modal textarea:focus {
        outline: none;
        border-color: #00ffff;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }

    .modal i {
        font-size: 12px;
        color: #888;
        font-style: normal;
        margin-top: 2px;
        display: block;
    }

    .modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        justify-content: flex-end;
    }

    .error-message {
        color: #ff3366;
        margin-top: 6px;
        font-size: 12px;
        background: rgba(255, 51, 102, 0.1);
        border-radius: 4px;
        padding: 8px 12px;
        display: none;
        border-left: 3px solid #ff3366;
        font-weight: 700;
    }

    td strong {
        color: #00ff88;
        font-weight: 700;
        display: block;
        margin-bottom: 4px;
    }

    body {
        padding: 30px;
        background: #000;
        min-height: 100vh;
        margin: 0;
    }
</style>
{% endblock %}

{% block main %}
    <h1>Список фильмов</h1>

    <table>
        <thead>
            <tr>
                <th colspan="2">Название</th>
                <th>Год</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="film-list"></tbody>
    </table>

    <script>
        fillFilmList();
    </script>

    <div>
        <button onclick="addFilm()">Добавить фильм</button>
    </div>

    <div class="modal">
        <input type="hidden" id="id">
        <label>
            Название фильма на русском:
            <input type="text" id="title_ru">
        </label><br>

        <label>
            Название фильма на оригинальном языке
            <i>(если фильм русский, то оставьте пустым):</i>
            <input type="text" id="title">
        </label><br>

        <label>
            Год выпуска:
            <input type="number" id="year">
        </label><br>

        <label>
            Описание:
            <textarea id="description"></textarea>
            <div id="description-error" class="error-message"></div>
        </label><br>

        <button onclick="sendFilm()">OK</button>
        <button onclick="cancel()">Отмена</button>
    </div>
{% endblock %}
